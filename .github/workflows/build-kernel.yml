name: Build W202DS Kernel

on:
  workflow_dispatch:
    inputs:
      config_url:
        description: "defconfig 来源（raw URL）"
        required: false
        default: "https://raw.githubusercontent.com/Yeamika/w202ds-linux/6.18.35/config/server.config"
      dts_url:
        description: "板级 DTS 来源（raw URL）"
        required: false
        default: "https://raw.githubusercontent.com/Yeamika/w202ds-linux/6.18.35/devicetree/w202ds-server.dts"
      jobs:
        description: "并行编译度"
        required: false
        default: "4"

concurrency:
  group: build-kernel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false
          lfs: false

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            flex bison bc libssl-dev libelf-dev \
            device-tree-compiler kmod rsync cpio
          aarch64-linux-gnu-gcc --version | head -1
          df -h / | tail -1

      - name: Fetch W202DS config
        run: |
          curl -fsSL "${{ inputs.config_url }}" -o .config
          echo "config bytes: $(wc -c < .config)"
          grep -E '^(CONFIG_LOCALVERSION|CONFIG_SYSTEM_TRUSTED_KEYS)=' .config || true

      - name: Resolve config
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
          LOCALVERSION:
        run: |
          make olddefconfig
          echo "--- release ---"
          make -s kernelrelease

      - name: Build Image and modules
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
          LOCALVERSION:
        run: |
          set -o pipefail
          make -j"${{ inputs.jobs }}" Image modules 2>&1 | tail -n 200

      - name: Build DTB
        run: |
          mkdir -p out
          curl -fsSL "${{ inputs.dts_url }}" -o out/w202ds-server.dts
          # 先做预处理再 dtc，兼容 /include/ 与 cpp 宏
          aarch64-linux-gnu-gcc -E -P -x assembler-with-cpp \
            -I include -I arch/arm64/boot/dts \
            out/w202ds-server.dts -o out/w202ds-server.pre.dts
          dtc -I dts -O dtb -o out/w202ds-server.dtb out/w202ds-server.pre.dts
          ls -lh out

      - name: Package
        run: |
          set -e
          mkdir -p dist
          cp arch/arm64/boot/Image dist/Image
          cp .config dist/kernel.config
          [ -f System.map ] && cp System.map dist/
          cp out/w202ds-server.dtb dist/ 2>/dev/null || true
          # 树内模块
          find . -name '*.ko' -not -path './dist/*' -print0 2>/dev/null \
            | xargs -0 -r -I{} cp {} dist/ 2>/dev/null || true
          ( cd dist && sha256sum * > SHA256SUMS )
          echo "--- dist ---"
          ls -lh dist
          echo "ko count: $(ls dist/*.ko 2>/dev/null | wc -l)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: w202ds-kernel-${{ github.sha }}
          path: dist/
          retention-days: 14
          compression-level: 0
