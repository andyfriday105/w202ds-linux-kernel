name: Build W202DS Kernel

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "配置 profile（debug / desktop）"
        required: false
        default: "debug"
      jobs:
        description: "并行编译度"
        required: false
        default: "4"

concurrency:
  group: build-kernel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            flex bison bc libssl-dev libelf-dev \
            device-tree-compiler kmod rsync cpio
          aarch64-linux-gnu-gcc --version | head -1
          df -h / | tail -1

      # 主仓库布局：kernel/ 与 Devices/ 必须同级（符号链接按 ../../../Devices/... 解析），
      # 且 Devices/drm/source/{baseline,pj4edk-boot-display}/common 是 pj4edk2 子模块，
      # 提供 common/include/pj4edk2_fbcon_viewport.h —— 必须递归初始化。
      - name: Fetch source tree
        run: |
          SRC="$GITHUB_WORKSPACE/src/6.18.35"
          mkdir -p "$SRC"
          cd "$SRC"
          git clone --depth 1 --branch 6.18.35 \
            https://github.com/Yeamika/w202ds-linux.git .
          git submodule update --init --recursive --depth 1
          echo "--- 子模块状态 ---"
          git submodule status
          echo "--- 共享头文件 ---"
          ls -1 Devices/drm/source/baseline/common/include/ | head -5
          ls -1 Devices/drm/source/pj4edk-boot-display/common/include/ | head -5
          echo "--- 符号链接 ---"
          readlink kernel/drivers/firmware/pj4edk-boot-display
          test -e kernel/drivers/firmware/pj4edk-boot-display/Kconfig && echo "链接可解析: OK"
          echo "--- kernel 仓库标识 ---"
          git -C kernel rev-parse HEAD
          git -C kernel status --porcelain | head -5 || true

      - name: Build kernel and modules
        working-directory: ${{ github.workspace }}/src/6.18.35
        env:
          LOCALVERSION: ""
        run: |
          set -o pipefail
          python3 -B scripts/build.py \
            --profile "${{ inputs.profile }}" \
            --kernel-out "output/kernel-${{ inputs.profile }}" \
            --jobs "${{ inputs.jobs }}" \
            all 2>&1 | tail -n 400

      - name: Dump build logs on failure
        if: failure()
        working-directory: ${{ github.workspace }}/src/6.18.35
        run: |
          KOUT="output/kernel-${{ inputs.profile }}"
          for f in "$KOUT/build.log" "$KOUT/configure.log"; do
            echo "########## $f ##########"
            if [ -f "$f" ]; then
              echo "(总行数: $(wc -l < "$f"))"
              grep -n -i -m 40 -E "error|Error [0-9]|No such|cannot|not found|undefined|fatal" "$f" | head -60 || true
              echo "---------- 尾部 120 行 ----------"
              tail -n 120 "$f"
            else
              echo "(缺失)"
            fi
            echo
          done
          echo "########## kernel-build.json ##########"
          [ -f "$KOUT/kernel-build.json" ] && cat "$KOUT/kernel-build.json" || echo "(缺失)"

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.sha }}
          path: |
            ${{ github.workspace }}/src/6.18.35/output/kernel-*/build.log
            ${{ github.workspace }}/src/6.18.35/output/kernel-*/configure.log
            ${{ github.workspace }}/src/6.18.35/output/kernel-*/kernel-build.json
          retention-days: 7
          if-no-files-found: warn

      - name: Build DTB
        working-directory: ${{ github.workspace }}/src/6.18.35
        run: |
          mkdir -p output/devicetree
          dtc -I dts -O dtb -o output/devicetree/w202ds-server.dtb \
            devicetree/w202ds-server.dts
          ls -lh output/devicetree

      - name: Package
        working-directory: ${{ github.workspace }}/src/6.18.35
        run: |
          set -e
          KO="output/kernel-${{ inputs.profile }}"
          mkdir -p dist
          cp "$KO/arch/arm64/boot/Image" dist/Image
          cp "$KO/.config" dist/kernel.config
          if [ -f "$KO/System.map" ]; then cp "$KO/System.map" dist/; fi
          if [ -f output/devicetree/w202ds-server.dtb ]; then
            cp output/devicetree/w202ds-server.dtb dist/
          fi
          find "$KO" -name '*.ko' -print0 2>/dev/null \
            | xargs -0 -r -I{} cp {} dist/ 2>/dev/null || true
          ( cd dist && sha256sum * > SHA256SUMS )
          echo "--- dist ---"
          ls -lh dist
          echo "ko count: $(ls dist/*.ko 2>/dev/null | wc -l)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: w202ds-kernel-${{ github.sha }}
          path: ${{ github.workspace }}/src/6.18.35/dist/
          retention-days: 14
          compression-level: 0

      - name: Summary
        if: always()
        run: |
          {
            echo "### W202DS kernel build"
            echo ""
            echo "- profile: \`${{ inputs.profile }}\`"
            echo "- jobs: \`${{ inputs.jobs }}\`"
            echo "- commit: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
